    const detail = `API-equivalent estimate${u.costIsPartial ? ' (some models unpriced)' : ''}\n${tokens(u.output)} output · ${tokens(u.cacheRead)} cache reads · ${tokens(u.cacheWrite)} cache writes · ${tokens(u.input)} input\n${u.models.join(', ')}`;
    return `<span class="chip chip-cost" title="${esc(detail)}">${u.cost === null ? `${tokens(u.output + u.input)} tokens` : `${money(u.cost)}${u.costIsPartial ? '+' : ''}`}</span>`;
  }

  function sessionRow(s, project) {
    const st = status(s.lastActivity);
    const folder = s.cwd && project && s.cwd !== project.path ? `<span class="chip" title="${esc(s.cwd)}">${icon('folder', 12)}<span>${esc(tilde(s.cwd))}</span></span>` : '';
    const meta = branchChip(s) + worktreeChip(s) + s.prs.map(prChip).join('') + artifactChip(s) + skillsChip(s) + costChip(s) + folder;
    return `
      <div class="row" tabindex="0" role="button" data-nav data-key="${esc(s.id)}" data-session="${esc(s.id)}" aria-label="${esc(s.title)}">
        <div class="c-session"><span class="dot ${st}" title="${STATUS_LABEL[st]}"></span><div class="s-main"><div class="s-title" title="${esc(s.title)}">${esc(s.title)}</div><div class="s-meta">${meta || '<span class="muted">No git branch</span>'}</div>${lastLine(s)}</div></div>
        <div class="c-mcp">${mcpChips(s.mcps, 2)}</div>
        <div class="c-time" title="${esc(fullDate(s.lastActivity))}">${esc(shortDate(s.lastActivity))}</div>
        <div class="c-idle">${isWorking(s) ? '<span class="working">Working…</span>' : `<span class="${st}" data-since="${esc(s.lastActivity)}">${esc(since(s.lastActivity))}</span>`}</div>
        <div class="c-id"><code title="${esc(s.id)}">${esc(s.id.slice(0, 8))}</code><button class="icon-btn sm" type="button" data-copy="${esc(s.id)}" data-label="Session ID" title="Copy session ID" aria-label="Copy session ID">${icon('copy', 14)}</button><button class="icon-btn sm" type="button" data-resume-project="${esc(state.projectId)}" data-resume-session="${esc(s.id)}" title="Resume in a new terminal" aria-label="Resume in a new terminal">${icon('terminal', 14)}</button></div>
      </div>`;
  }

  function renderProject() {
    const project = currentProject();
    const head = project
      ? `<div class="page-head">${avatar(baseName(project.path), 'lg')}<div style="min-width:0"><h1>${esc(baseName(project.path))}</h1><p class="mono" title="${esc(project.path)}">${esc(tilde(project.path))}</p></div></div>`
      : '<div class="page-head"><span class="sk" style="width:36px;height:36px;border-radius:9px"></span><div><div class="sk" style="height:20px;width:150px"></div><div class="sk" style="height:11px;width:230px;margin-top:8px"></div></div></div>';

    if (state.sessionsError) {
      return state.sessionsError.status === 404
        ? emptyState('folder', 'Project not found', 'This project no longer has any Claude Code sessions.', '<a class="btn" href="#/">Back to projects</a>')
        : emptyState('alert', 'Could not load sessions', esc(state.sessionsError.message), `<button class="btn" data-action="retry">${icon('refresh', 14)} Try again</button>`);
    }
    if (!state.sessions) {
      return `${head}<div class="stats">${Array.from({ length: 6 }, () => '<div class="stat"><div class="sk" style="height:11px;width:60%"></div><div class="sk" style="height:22px;width:40px;margin-top:10px"></div></div>').join('')}</div>
        <div class="table"><div class="thead"><span>Session</span></div>${Array.from({ length: 7 }, () => '<div class="row" style="cursor:default"><div class="c-session"><span class="sk" style="width:8px;height:8px;border-radius:50%;margin-top:6px"></span><div class="s-main"><div class="sk" style="height:13px;width:58%"></div><div class="sk" style="height:18px;width:38%;margin-top:8px"></div></div></div><div class="c-mcp"><span class="sk" style="height:18px;width:70%"></span></div><div class="c-time"><span class="sk" style="display:block;height:11px;width:80%"></span></div><div class="c-idle"><span class="sk" style="display:block;height:11px;width:50%"></span></div><div class="c-id"><span class="sk" style="display:block;height:11px;width:70%"></span></div></div>').join('')}</div>`;
    }

    const all = state.sessions;
    const counts = Object.fromEntries(Object.entries(FILTERS).map(([key, test]) => [key, all.filter(test).length]));
    const visible = all.filter(FILTERS[state.filter]).filter((s) => matchesQuery(sessionText(s), search.value));
    const groups = new Map();
    for (const s of visible) {
      const label = dayGroup(s.lastActivity);
      if (!groups.has(label)) groups.set(label, []);
      groups.get(label).push(s);
    }
    const filtered = state.filter !== 'all' || search.value.trim();
    const body = visible.length
      ? GROUP_ORDER.filter((label) => groups.has(label)).map((label) => `
          <div class="group">${esc(label)} <span class="count">${groups.get(label).length}</span></div>
          ${groups.get(label).map((s) => sessionRow(s, project)).join('')}`).join('')
      : filtered
        ? emptyState('search', 'No matching sessions', search.value.trim() ? `Nothing matches “${esc(search.value.trim())}” with this filter.` : 'No sessions match this filter.', '<button class="btn" data-action="clear">Clear filters</button>')
        : emptyState('history', 'No sessions yet', 'Sessions appear here once Claude Code has run in this folder.');

    return `${head}
      <div class="stats">
        ${stat('all', 'All sessions', 'list', counts.all)}
        ${stat('active', 'Active now', 'activity', counts.active)}
        ${stat('prs', 'With pull requests', 'pr', counts.prs)}
        ${stat('worktree', 'In worktrees', 'layers', counts.worktree)}
        ${stat('artifacts', 'With artifacts', 'artifact', counts.artifacts)}
        <div class="stat static" title="What these sessions would cost at Anthropic API list prices. Subscription plans bill differently."><div class="stat-label">${icon('activity', 14)} API-equivalent cost</div><div class="stat-value">${money(all.reduce((sum, s) => sum + (s.usage?.cost ?? 0), 0))}</div></div>
      </div>
      <div class="table" role="list">
        <div class="thead"><span>Session</span><span class="c-mcp">MCP servers</span><span class="c-time">Last activity</span><span class="c-idle">Idle for</span><span class="c-id">Session ID</span></div>
        ${body}
      </div>`;
  }

  function fitHeaderChips() {
    const meta = content.querySelector('.session-head .s-meta');
    if (!meta || meta.classList.contains('expanded')) return;
    meta.querySelector('.chip-more')?.remove();
    const chips = [...meta.children];
    chips.forEach((chip) => { chip.hidden = false; });
    if (meta.scrollWidth <= meta.clientWidth) return;
    const more = Object.assign(document.createElement('button'), { type: 'button', className: 'chip chip-more' });
    more.dataset.action = 'expand-chips';
    meta.append(more);
    const hidden = [];
    for (let i = chips.length - 1; i > 0 && meta.scrollWidth > meta.clientWidth; i--) {
      chips[i].hidden = true;
      hidden.unshift(chips[i]);
      more.textContent = `+${hidden.length} more`;
    }
    more.title = `${hidden.map((chip) => chip.textContent.trim()).join('\n')}\n\nClick to show all`;
  }

  function renderContent() {
    const focusedKey = content.contains(document.activeElement) ? document.activeElement.dataset.key : null;
    const sessionPage = Boolean(state.sessionId && !state.sessionsError);
    content.classList.toggle('is-session', sessionPage);
    content.innerHTML = sessionPage ? renderSession() : state.projectId ? renderProject() : renderOverview();
    fitHeaderChips();
    updateJump();
    if (focusedKey) {
      [...content.querySelectorAll('[data-nav]')].find((el) => el.dataset.key === focusedKey)?.focus({ preventScroll: true });
    }
  }

  /* ---------- Markdown (escape first, then add a small set of safe tags) ---------- */

  function inline(text) {
    const saved = [];
    const keep = (html) => `\u0001${saved.push(html) - 1}\u0001`;
    let out = esc(text);
    out = out.replace(/`([^`]+)`/g, (_, code) => keep(`<code>${code}</code>`));
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => keep(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`));
    out = out.replace(/(^|[\s(])(https?:\/\/[^\s<)]*[^\s<).,;:!?])/g, (_, lead, url) => `${lead}${keep(`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`)}`);
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>');
    return out.replace(/\u0001(\d+)\u0001/g, (_, i) => saved[i]);
  }

  const linkify = (text) => esc(text).replace(/(^|[\s(])(https?:\/\/[^\s<)]*[^\s<).,;:!?])/g, (_, lead, url) => `${lead}<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);

  function markdown(source) {
    const fences = [];
    const text = String(source ?? '').replace(/```[^\n]*\n([\s\S]*?)(?:```|$)/g, (_, code) => `\u0000${fences.push(`<pre><code>${esc(code.replace(/\n$/, ''))}</code></pre>`) - 1}\u0000`);
    const lines = text.split('\n');
    const isTableRow = (line) => /^\s*\|.*\|\s*$/.test(line ?? '');
    const blockStart = (line) => /^\s*(#{1,6}\s|[-*+]\s|\d+[.)]\s|>|\u0000)/.test(line) || /^\s*(-{3,}|\*{3,})\s*$/.test(line);
    const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((cell) => inline(cell.trim()));
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      let match;
      if (!line.trim()) { i++; continue; }
      if ((match = line.trim().match(/^\u0000(\d+)\u0000$/))) { html += fences[match[1]]; i++; continue; }
      if ((match = line.match(/^\s*(#{1,6})\s+(.*)$/))) { const level = Math.min(Math.max(match[1].length + 1, 3), 6); html += `<h${level}>${inline(match[2])}</h${level}>`; i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { html += '<hr>'; i++; continue; }
      if (isTableRow(line) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] ?? '')) {
        const rows = [];
        while (isTableRow(lines[i])) rows.push(lines[i++]);
        const [head, , ...body] = rows;
        html += `<div class="md-table"><table><thead><tr>${cells(head).map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body.map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        continue;
      }
      const listType = /^\s*[-*+]\s+/.test(line) ? 'ul' : /^\s*\d+[.)]\s+/.test(line) ? 'ol' : null;
      if (listType) {
        const marker = listType === 'ul' ? /^\s*[-*+]\s+/ : /^\s*\d+[.)]\s+/;
        const items = [];
        while (i < lines.length && lines[i].trim()) {
          if (marker.test(lines[i])) items.push(lines[i].replace(marker, ''));
          else if (/^\s+\S/.test(lines[i]) && items.length && !/^\s*\u0000/.test(lines[i])) items[items.length - 1] += `\n${lines[i].trim()}`;
          else break;
          i++;
        }
        html += `<${listType}>${items.map((item) => `<li>${item.split('\n').map(inline).join('<br>')}</li>`).join('')}</${listType}>`;
        continue;
      }
      if (/^\s*>/.test(line)) {
        const quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ''));
        html += `<blockquote>${quote.map(inline).join('<br>')}</blockquote>`;
        continue;
      }
      const paragraph = [];
      while (i < lines.length && lines[i].trim() && !(paragraph.length && (blockStart(lines[i]) || isTableRow(lines[i])))) paragraph.push(lines[i++]);
      html += `<p>${paragraph.map(inline).join('<br>')}</p>`;
    }
    return html;
  }

  /* ---------- Session page ---------- */

  const timeOf = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '');
  function dayLabel(iso) {
    const diff = dayDiff(iso);
    if (diff <= 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return new Date(iso).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function toolLabel(name) {
    const mcp = /^mcp__(.+?)__(.+)$/.exec(name);
    if (mcp) return [`${mcpName(mcp[1])} · ${mcp[2]}`, 'plug'];
    if (name === 'Bash') return ['Bash', 'terminal'];
    if (['Read', 'Write', 'Edit', 'NotebookEdit'].includes(name)) return [name, 'file'];
    if (['Grep', 'Glob'].includes(name)) return [name, 'search'];
    if (['WebSearch', 'WebFetch'].includes(name)) return [name, 'globe'];
    if (name === 'Agent' || name === 'Task') return [name, 'sparkles'];
    return [name, 'wrench'];
  }

  const toolsById = new Map();

  function toolBlock(tool) {
    toolsById.set(tool.id, tool);
    const [label, iconName] = toolLabel(tool.name);
    const stateLabel = tool.isError ? '<span class="tool-state error">Failed</span>' : tool.result === null ? '<span class="tool-state pending">No result</span>' : '';
    return `<details class="tool" data-tool="${esc(tool.id)}"><summary><span class="chev">${icon('chevron', 12)}</span><span class="tool-icon">${icon(iconName, 13)}</span><span class="tool-name">${esc(label)}</span><span class="tool-sum" title="${esc(tool.summary)}">${esc(tool.summary)}</span>${stateLabel}</summary><div class="tool-body"></div></details>`;
  }

  function fillTool(details) {
    const body = details.querySelector('.tool-body');
    const tool = toolsById.get(details.dataset.tool);
    if (!tool || body.childElementCount) return;
    body.innerHTML = `<div class="tool-label">Input</div><pre>${esc(tool.input)}</pre>${tool.result === null ? '' : `<div class="tool-label">${tool.isError ? 'Error' : 'Result'}</div><pre>${esc(tool.result || '(empty)')}</pre>`}`;
  }

  function diffLines(text, mark, cls) {
    if (!text) return '';
    const all = String(text).split('\n');
    const shown = all.slice(0, 300).map((line) => `<span class="${cls}">${mark} ${esc(line)}</span>`).join('');
    return shown + (all.length > 300 ? `<span class="${cls}">${mark} … ${all.length - 300} more lines</span>` : '');
  }

  function fillFileDiff(details) {
    const body = details.querySelector('.diff-body');
    if (body.childElementCount) return;
    if (!state.messages) {
      body.innerHTML = '<div class="none">The conversation is still loading.</div>';
      return;
    }
    const calls = state.messages.filter((item) => item.kind === 'tool' && item.path === details.dataset.file && !item.isError);
    body.innerHTML = calls.length ? calls.map((call) => {
      const diff = (call.edits ?? []).map((change) => diffLines(change.old, '-', 'del') + diffLines(change.new, '+', 'add')).join('<span class="gap"></span>');
      return `<div><div class="diff-head">${esc(call.name === 'Write' ? 'Wrote the whole file' : call.name)} · ${esc(timeOf(call.at))}</div><pre class="diff">${diff || '<span>(empty)</span>'}</pre></div>`;
    }).join('') : '<div class="none">No successful edits found in the conversation.</div>';
  }

  function chatBody(items) {
    toolsById.clear();
    let html = '';
    let day = null;
    let turn = null;
    const closeTurn = () => {
      if (!turn) return;
      html += `<div class="msg-claude${turn.onlyTools ? ' tools-only' : ''}"><span class="claude-avatar">${icon('sparkles', 15)}</span><div class="turn"><div class="turn-head">Claude <span class="msg-time">${esc(timeOf(turn.at))}</span></div>${turn.html}</div></div>`;
      turn = null;
    };
    for (const item of items) {
      const itemDay = item.at ? new Date(item.at).toDateString() : day;
      if (itemDay && itemDay !== day) {
        closeTurn();
        html += `<div class="day">${esc(dayLabel(item.at))}</div>`;
        day = itemDay;
      }
      if (item.kind === 'assistant' || item.kind === 'tool') {
        turn ??= { at: item.at, html: '', onlyTools: true };
        if (item.kind === 'tool') {
          turn.html += toolBlock(item);
        } else {
          turn.onlyTools = false;
          turn.html += `<div class="reply"><div class="md">${markdown(item.text)}</div><button class="icon-btn sm msg-copy" type="button" data-copy="${esc(item.text)}" data-label="Message" title="Copy message" aria-label="Copy message">${icon('copy', 13)}</button></div>`;
        }
        continue;
      }
      closeTurn();
      if (item.kind === 'user') html += `<div class="msg-user"><div class="bubble">${linkify(item.text)}</div><span class="msg-time">You · ${esc(timeOf(item.at))}</span></div>`;
      else if (item.kind === 'command') html += `<div class="msg-user"><div class="bubble command">${icon('terminal', 13)}${esc(item.text)}</div><span class="msg-time">You · ${esc(timeOf(item.at))}</span></div>`;
      else if (item.kind === 'event') html += `<div class="event">${icon('activity', 12)}<span>${esc(item.text)}</span></div>`;
      else if (item.kind === 'compact') html += `<details class="compact-note"><summary>Earlier conversation was summarized to free up context</summary><div class="md">${markdown(item.text)}</div></details>`;
    }
    closeTurn();
    if (isWorking(currentSession())) {
      const last = items.at(-1);
      const doing = last?.kind === 'tool' && last.result === null ? `Running ${toolLabel(last.name)[0]}${last.summary ? ` · ${last.summary}` : ''}` : 'Thinking…';
      html += `<div class="msg-claude" aria-live="polite"><span class="claude-avatar">${icon('sparkles', 15)}</span><div class="turn"><div class="turn-head">Claude <span class="msg-time">working</span></div><div class="working-text"><span class="typing"><span></span><span></span><span></span></span><span>${esc(doing)}</span></div></div></div>`;
    }
    return html;
  }

  function renderChat() {
    if (state.messagesError) {
      return emptyState('alert', 'Could not load the conversation', esc(state.messagesError.message), `<button class="btn" data-action="retry">${icon('refresh', 14)} Try again</button>`);
    }
    if (!state.messages) {
      return `<div class="chat-toolbar"><span class="sk" style="height:12px;width:220px"></span></div><div class="chat">
        <div class="msg-user"><span class="sk" style="height:40px;width:52%;border-radius:16px"></span></div>
        <div class="msg-claude"><span class="sk" style="width:28px;height:28px;border-radius:8px"></span><div class="turn"><span class="sk" style="height:12px;width:90%"></span><span class="sk" style="height:12px;width:75%"></span><span class="sk" style="height:30px;width:100%"></span></div></div>
        <div class="msg-user"><span class="sk" style="height:40px;width:38%;border-radius:16px"></span></div></div>`;
    }
    const count = (kind) => state.messages.filter((item) => item.kind === kind).length;
    const toolbar = `<div class="chat-toolbar"><span><strong>${count('user') + count('command')}</strong> prompts · <strong>${count('assistant')}</strong> replies · <strong>${count('tool')}</strong> tool calls</span><span class="spacer"></span><label class="switch"><input type="checkbox" id="tools-toggle"${state.showTools ? ' checked' : ''}> Show tool calls</label></div>`;
    if (!state.messages.length) return toolbar + emptyState('history', 'No messages yet', 'This session has no conversation to show.');
    return `${toolbar}<div class="chat${state.showTools ? '' : ' hide-tools'}">${chatBody(state.messages)}</div>`;
  }

  function sessionInfo(s) {
    const copyBtn = (value, label) => `<button class="icon-btn sm" type="button" data-copy="${esc(value)}" data-label="${esc(label)}" title="Copy ${esc(label.toLowerCase())}" aria-label="Copy ${esc(label.toLowerCase())}">${icon('copy', 14)}</button>`;
    return `
      <div class="section">
        <div class="section-title"><span>Resume</span></div>
        <button class="btn-resume primary" type="button" data-resume-project="${esc(state.projectId)}" data-resume-session="${esc(s.id)}">${icon('terminal', 14)} Resume in terminal</button>
        <div class="cmd"><span class="prompt">$ </span>${esc(resumeCommand(s))}<button class="icon-btn sm" type="button" data-copy="${esc(resumeCommand(s))}" data-label="Resume command" title="Copy resume command" aria-label="Copy resume command">${icon('copy', 14)}</button></div>
        <div class="hint">Opens a new terminal window that picks up where this session stopped. You can also paste the command yourself.</div>
      </div>
      <div class="section">
        <div class="section-title"><span>Details</span></div>
        <dl class="props">
          <dt>Session ID</dt><dd><span class="val mono">${esc(s.id)}</span>${copyBtn(s.id, 'Session ID')}</dd>
          <dt>Folder</dt><dd><span class="val mono" title="${esc(s.cwd)}">${esc(tilde(s.cwd) || '—')}</span>${s.cwd ? copyBtn(s.cwd, 'Folder') : ''}</dd>
          <dt>Git branch</dt><dd><span class="val mono">${esc(s.gitBranch || '—')}</span>${s.gitBranch ? copyBtn(s.gitBranch, 'Branch') : ''}</dd>
          <dt>Last activity</dt><dd><span class="val">${esc(fullDate(s.lastActivity))}</span></dd>
          <dt>Idle for</dt><dd><span class="val" data-since="${esc(s.lastActivity)}">${esc(since(s.lastActivity))}</span></dd>
        </dl>
      </div>
      <div class="section">
        <div class="section-title"><span>Usage</span><span>API-equivalent</span></div>
        ${s.usage && s.usage.output + s.usage.input + s.usage.cacheRead ? `<dl class="props">
          <dt>Estimated cost</dt><dd><span class="val"><strong>${s.usage.cost === null ? '—' : money(s.usage.cost)}</strong>${s.usage.costIsPartial ? ' <span class="muted">(some models unpriced)</span>' : ''}</span></dd>
          <dt>Output</dt><dd><span class="val">${tokens(s.usage.output)} tokens</span></dd>
          <dt>Cache reads</dt><dd><span class="val">${tokens(s.usage.cacheRead)} tokens</span></dd>
          <dt>Cache writes</dt><dd><span class="val">${tokens(s.usage.cacheWrite)} tokens</span></dd>
          <dt>Input</dt><dd><span class="val">${tokens(s.usage.input)} tokens</span></dd>
          <dt>Models</dt><dd><span class="val mono">${esc(s.usage.models.join(', ') || '—')}</span></dd>
        </dl><div class="hint">Estimated from Anthropic API list prices. Subscription plans bill differently, and subagent work isn't included.</div>` : '<div class="none">No token usage recorded in this session.</div>'}
      </div>
      <div class="section">
        <div class="section-title"><span>Files changed</span><span>${s.filesChanged.length}</span></div>
        ${s.filesChanged.length ? `<div class="list">${s.filesChanged.map((f) => `<details class="file-diff" data-file="${esc(f.path)}"><summary><span class="chev">${icon('chevron', 12)}</span><span class="path" title="${esc(f.path)}"><b>${esc(baseName(f.path))}</b> <span>${esc(relativePath(f.path, s.cwd).split('/').slice(0, -1).join('/'))}</span></span><span class="muted" style="font-size:12px;white-space:nowrap">${plural(f.edits, 'edit')}</span></summary><div class="diff-body"></div></details>`).join('')}</div>` : '<div class="none">This session did not edit any files.</div>'}
      </div>
      <div class="section">
        <div class="section-title"><span>Pull requests</span><span>${s.prs.length}</span></div>
        ${s.prs.length ? `<div class="list">${s.prs.map((pr) => /^https:\/\//.test(pr.url)
          ? `<a class="list-item" href="${esc(pr.url)}" target="_blank" rel="noopener noreferrer"><span class="pr-icon">${icon('pr', 16)}</span><span class="grow"><strong>${esc(repoName(pr.repository) || pr.url)}</strong> <span class="muted">#${esc(pr.number)}</span><div class="muted" style="font-size:12px">${esc(pr.repository)}</div></span>${icon('external', 14)}</a>`
          : `<div class="list-item"><span class="pr-icon">${icon('pr', 16)}</span><span class="grow">${esc(pr.url)}</span></div>`).join('')}</div>` : '<div class="none">No pull requests were opened in this session.</div>'}
      </div>
      <div class="section">
        <div class="section-title"><span>Artifacts</span><span>${s.artifacts.length}</span></div>
        ${s.artifacts.length ? `<div class="list">${s.artifacts.map((a) => `<a class="list-item" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer"><span class="pr-icon" style="color:var(--accent)">${icon('artifact', 16)}</span><span class="grow"><strong>${esc(a.name)}</strong><div class="muted" style="font-size:12px">${ARTIFACT_CHANGE[a.change]}${a.version ? ` · version ${a.version}` : ''}</div></span>${icon('external', 14)}</a>`).join('')}</div>` : '<div class="none">No artifacts were published or opened in this session.</div>'}
      </div>
      <div class="section">
        <div class="section-title"><span>Git worktrees</span><span>${s.worktrees.length}</span></div>
        ${s.worktrees.length ? `<div class="list">${s.worktrees.map((w) => `<div class="list-item"><span class="pr-icon" style="color:var(--blue)">${icon('layers', 16)}</span><span class="grow"><span class="mono" title="${esc(w.path)}">${esc(tilde(w.path))}</span><div class="muted" style="font-size:12px">${w.exists ? 'Still on disk' : 'Removed'}</div></span>${w.exists ? copyBtn(w.path, 'Worktree path') : ''}</div>`).join('')}</div>` : '<div class="none">This session did not create or enter a git worktree.</div>'}
      </div>
      <div class="section">
        <div class="section-title"><span>Skills used</span><span>${(s.skills ?? []).length}</span></div>
        ${s.skills?.length ? `<div class="chips">${s.skills.map((k) => `<span class="chip chip-skill" title="${esc(`Started by ${k.by.map((who) => (who === 'you' ? 'you' : 'Claude')).join(' and ')}${k.uses > 1 ? `, ${k.uses} times` : ''}`)}">${icon('skill', 12)}<span>/${esc(k.name)}${k.uses > 1 ? ` ×${k.uses}` : ''}</span>${k.by.includes('you') ? '<span class="who">you</span>' : ''}</span>`).join('')}</div><div class="hint">Skills marked “you” were typed as slash commands; the rest were loaded by Claude.</div>` : '<div class="none">No skills were used in this session.</div>'}
      </div>
      <div class="section">
        <div class="section-title"><span>MCP servers used</span><span>${s.mcps.length}</span></div>
        ${s.mcps.length ? `<div class="chips">${s.mcps.map((m) => `<span class="chip chip-mcp" title="${esc(m)}">${icon('plug', 12)}<span>${esc(mcpName(m))}</span></span>`).join('')}</div>` : '<div class="none">This session did not call any MCP server.</div>'}
      </div>`;
  }

  function renderSession() {
    const s = currentSession();
    if (!state.sessions) {
      return `<div class="session-head"><div class="sk" style="height:18px;width:32%"></div><div class="sk" style="height:22px;width:28%"></div></div><div class="session-layout"><section class="chat-card">${renderChat()}</section><aside class="session-aside"><div class="sk" style="height:90px;border-radius:10px"></div><div class="sk" style="height:250px;border-radius:10px"></div></aside></div>`;
    }
    if (!s) {
      return emptyState('history', 'Session not found', 'This session no longer exists in this project.', `<a class="btn" href="${projectHref()}">Back to sessions</a>`);
    }
    const st = status(s.lastActivity);
    return `
      <div class="session-head">
        <h1 title="${esc(s.title)}">${esc(s.title)}</h1>
        <div class="s-meta">${isWorking(s) ? '<span class="pill active"><span class="dot active"></span>Claude is working</span>' : `<span class="pill ${st}"><span class="dot ${st}"></span>${STATUS_LABEL[st]} · idle&nbsp;<span data-since="${esc(s.lastActivity)}">${esc(since(s.lastActivity))}</span></span>`}${branchChip(s)}${worktreeChip(s)}${s.prs.map(prChip).join('')}${artifactChip(s)}${costChip(s)}</div>
      </div>
      <div class="session-layout">
        <section class="chat-card" aria-label="Conversation">${renderChat()}<button class="jump" type="button" data-action="latest" hidden>${icon('arrow', 14)} Latest</button></section>
        <aside class="session-aside" aria-label="Session details">${sessionInfo(s)}</aside>
      </div>`;
  }

  const chatBox = () => content.querySelector('.chat');
  const nearBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 160;

  function updateJump() {
    const chat = chatBox();
    const jump = content.querySelector('.jump');
    if (jump) jump.hidden = !chat || nearBottom(chat);
  }

  function renderSessionPreservingView() {
    const before = chatBox();
    const wasAtBottom = before ? nearBottom(before) : false;
    const scrollTop = before?.scrollTop ?? 0;
    const open = [...content.querySelectorAll('details.tool[open]')].map((el) => el.dataset.tool);
    const openFiles = [...content.querySelectorAll('details.file-diff[open]')].map((el) => el.dataset.file);
    renderContent();
    for (const id of open) {
      const details = content.querySelector(`details.tool[data-tool="${CSS.escape(id)}"]`);
      if (details) { fillTool(details); details.open = true; }
    }
    for (const path of openFiles) {
      const details = [...content.querySelectorAll('details.file-diff')].find((el) => el.dataset.file === path);
      if (details) { fillFileDiff(details); details.open = true; }
    }
    const chat = chatBox();
    if (chat) chat.scrollTop = wasAtBottom ? chat.scrollHeight : scrollTop;
    updateJump();
  }

  function render() {
    renderNav();
    renderTopbar();
    renderContent();
  }

  function tickUpdated() {
    $('updated').textContent = state.updatedAt ? `Updated ${ago(new Date(state.updatedAt).toISOString())}` : '';
  }

  function tick() {
    for (const el of document.querySelectorAll('[data-since]')) el.textContent = since(el.dataset.since);
    for (const el of document.querySelectorAll('[data-ago]')) el.textContent = ago(el.dataset.ago);
    tickUpdated();
  }

  /* ---------- Data ---------- */

  async function loadRecent() {
    try {
      state.recent = await getJSON('/api/recent?hours=24');
      state.recentError = null;
    } catch (error) {
      state.recentError = error;
    }
  }

  async function loadProjects() {
    try {
      state.projects = await getJSON('/api/projects');
      state.projectsError = null;
    } catch (error) {
      state.projectsError = error;
    }
  }

  const messagesKey = () => `${state.projectId}/${state.sessionId}`;
  const messagesSignature = () => {
    const last = state.messages?.at(-1);
    return state.messagesError ? 'error' : state.messages ? `${state.messages.length}:${last?.at}:${last?.result?.length ?? ''}:${isWorking(currentSession())}` : 'none';
  };

  async function loadMessages() {
    const key = messagesKey();
    try {
      const messages = await getJSON(`/api/projects/${encodeURIComponent(state.projectId)}/sessions/${encodeURIComponent(state.sessionId)}/messages`);
      if (messagesKey() !== key) return;
      state.messages = messages;
      state.messagesError = null;
    } catch (error) {
      if (messagesKey() !== key) return;
      state.messagesError = error;
    }
  }

  async function loadSessions() {
    const id = state.projectId;
    try {
      const sessions = await getJSON(`/api/projects/${encodeURIComponent(id)}/sessions`);
      if (state.projectId !== id) return;
      state.sessions = sessions;
      state.sessionsError = null;
    } catch (error) {
      if (state.projectId !== id) return;
      state.sessionsError = error;
    }
  }

  let refreshing = false;
  async function refresh() {
    if (refreshing) return;
    refreshing = true;
    shell.classList.add('is-refreshing');
    const before = messagesSignature();
    await Promise.all([loadProjects(), state.projectId ? loadSessions() : loadRecent(), state.sessionId ? loadMessages() : null]);
    state.updatedAt = Date.now();
    refreshing = false;
    shell.classList.remove('is-refreshing');
    renderNav();
    renderTopbar();
    if (!state.sessionId) renderContent();
    else if (messagesSignature() !== before) renderSessionPreservingView();
    else tick();
  }

  /* ---------- Routing ---------- */

  function parseRoute() {
    const match = location.hash.match(/^#\/p\/([^/]+)(?:\/s\/([^/]+))?/);
    return { projectId: match ? decodeURIComponent(match[1]) : null, sessionId: match?.[2] ? decodeURIComponent(match[2]) : null };
  }

  async function applyRoute() {
    const { projectId, sessionId } = parseRoute();
    const projectChanged = projectId !== state.projectId;
    const sessionChanged = projectChanged || sessionId !== state.sessionId;
    const leftSession = !sessionId ? state.sessionId : null;
    state.projectId = projectId;
    state.sessionId = sessionId;
    document.body.classList.remove('nav-open');
    if (projectChanged) {
      state.sessions = null;
      state.sessionsError = null;
      state.filter = 'all';
      search.value = '';
    }
    if (sessionChanged) {
      state.messages = null;
      state.messagesError = null;
      main.scrollTop = 0;
    }
    render();
    const loads = [projectChanged && projectId ? loadSessions() : null, sessionChanged && sessionId ? loadMessages() : null, !projectId && (projectChanged || !state.recent) ? loadRecent() : null].filter(Boolean);
    if (loads.length) {
      await Promise.all(loads);
      state.updatedAt = Date.now();
      render();
    }
    if (sessionChanged && sessionId && chatBox()) {
      chatBox().scrollTop = chatBox().scrollHeight;
      updateJump();
    }
    if (leftSession) {
      const row = content.querySelector(`[data-session="${CSS.escape(leftSession)}"]`);
      row?.focus({ preventScroll: true });
      row?.scrollIntoView({ block: 'center' });
    }
  }

  /* ---------- Actions ---------- */

  let toastTimer;
  function showToast(message, isError = false) {
    toast.innerHTML = `${icon(isError ? 'alert' : 'check', 15)}<span>${esc(message)}</span>`;
    toast.classList.toggle('error', isError);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  async function copy(text, label, button) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const area = Object.assign(document.createElement('textarea'), { value: text });
      document.body.append(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
    showToast(`${label} copied`);
    if (button) {
      const original = button.innerHTML;
      button.innerHTML = icon('check', 14);
      setTimeout(() => { button.innerHTML = original; }, 1200);
    }
  }

  async function resumeSession(projectId, sessionId, button) {
    const session = [...(state.sessions ?? []), ...(state.recent ?? [])].find((s) => s.id === sessionId);
    if (session && (isWorking(session) || status(session.lastActivity) === 'active')
      && !window.confirm('Claude may still be running in this session. Opening it again starts a second copy of the same conversation. Continue?')) {
      return;
    }
    button.disabled = true;
    try {
      const response = await fetch('/api/resume', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-requested-with': 'claude-sessions-dashboard' },
        body: JSON.stringify({ projectId, sessionId }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || response.statusText);
      showToast('Opened in a new terminal window');
    } catch (error) {
      showToast(`Could not open a terminal: ${error.message}`, true);
    } finally {
      button.disabled = false;
    }
  }

  function handleClick(event) {
    const resume = event.target.closest('[data-resume-session]');
    if (resume) {
      event.preventDefault();
      event.stopPropagation();
      return resumeSession(resume.dataset.resumeProject, resume.dataset.resumeSession, resume);
    }
    const copyButton = event.target.closest('[data-copy]');
    if (copyButton) {
      event.preventDefault();
      event.stopPropagation();
      copy(copyButton.dataset.copy, copyButton.dataset.label || 'Copied', copyButton);
      return;
    }
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (action === 'retry') return refresh();
    if (action === 'expand-chips') {
      const meta = event.target.closest('.s-meta');
      meta.classList.add('expanded');
      meta.querySelectorAll('[hidden]').forEach((chip) => { chip.hidden = false; });
      return event.target.closest('.chip-more').remove();
    }
    if (action === 'latest') return chatBox()?.scrollTo({ top: chatBox().scrollHeight, behavior: 'smooth' });
    if (action === 'clear') {
      search.value = '';
      state.filter = 'all';
      return renderContent();
    }
    const filter = event.target.closest('[data-filter]')?.dataset.filter;
    if (filter) {
      state.filter = state.filter === filter ? 'all' : filter;
      return renderContent();
    }
    if (event.target.closest('a')) return;
    const link = event.target.closest('[data-href]');
    if (link) return (location.hash = link.dataset.href);
    const row = event.target.closest('[data-session]');
    if (row) location.hash = sessionHref(row.dataset.session);
  }

  content.addEventListener('click', handleClick);
  content.addEventListener('scroll', (event) => event.target.classList?.contains('chat') && updateJump(), true);
  content.addEventListener('toggle', (event) => {
    if (!event.target.open) return;
    if (event.target.matches?.('details.tool')) fillTool(event.target);
    if (event.target.matches?.('details.file-diff')) fillFileDiff(event.target);
  }, true);
  content.addEventListener('change', (event) => {
    if (event.target.id !== 'tools-toggle') return;
    state.showTools = event.target.checked;
    try { localStorage.setItem('showTools', String(state.showTools)); } catch {}
    content.querySelector('.chat')?.classList.toggle('hide-tools', !state.showTools);
    updateJump();
  });
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitHeaderChips, 100);
  });
  $('backdrop').addEventListener('click', () => document.body.classList.remove('nav-open'));
  $('menu-btn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('refresh-btn').addEventListener('click', refresh);
  search.addEventListener('input', renderContent);
  window.addEventListener('hashchange', applyRoute);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && refresh());

  function moveFocus(step) {
    const items = [...content.querySelectorAll('[data-nav]')];
    if (!items.length) return;
    const index = items.indexOf(document.activeElement);
    const next = items[index === -1 ? (step > 0 ? 0 : items.length - 1) : Math.min(items.length - 1, Math.max(0, index + step))];
    next.focus();
    next.scrollIntoView({ block: 'nearest' });
  }

  document.addEventListener('keydown', (event) => {
    const typing = event.target.matches('input, textarea');
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      search.focus();
      search.select();
      return;
    }
    if (event.key === 'Escape') {
      if (state.sessionId && !typing) return (location.hash = projectHref());
      if (document.body.classList.contains('nav-open')) return document.body.classList.remove('nav-open');
      if (typing && search.value) {
        search.value = '';
        return renderContent();
      }
      if (typing) return search.blur();
      return;
    }
    if (typing) {
      if (event.key === 'ArrowDown' || event.key === 'Enter') {
        event.preventDefault();
        moveFocus(1);
      }
      return;
    }
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const key = event.key.toLowerCase();
    if (key === '/') {
      event.preventDefault();
      search.focus();
    } else if (key === 'j' || event.key === 'ArrowDown') {
      event.preventDefault();
      moveFocus(1);
    } else if (key === 'k' || event.key === 'ArrowUp') {
      event.preventDefault();
      moveFocus(-1);
    } else if ((event.key === 'Enter' || event.key === ' ') && document.activeElement?.dataset.session) {
      event.preventDefault();
      location.hash = document.activeElement.dataset.href ?? sessionHref(document.activeElement.dataset.session);
    } else if (key === 'c') {
      const id = state.sessionId || document.activeElement?.dataset.session;
      if (id) copy(id, 'Session ID');
    }
  });

  /* ---------- Theme ---------- */

  const THEMES = ['system', 'light', 'dark'];
  const THEME_ICON = { system: 'monitor', light: 'sun', dark: 'moon' };
  let theme = 'system';
  try { theme = THEMES.includes(localStorage.getItem('theme')) ? localStorage.getItem('theme') : 'system'; } catch {}
  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.dataset.theme = theme;
    const button = $('theme-btn');
    button.innerHTML = icon(THEME_ICON[theme], 16);
    button.title = `Theme: ${theme[0].toUpperCase()}${theme.slice(1)}`;
    button.setAttribute('aria-label', button.title);
  }
  $('theme-btn').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('theme', theme); } catch {}
    applyTheme();
  });
  applyTheme();

  /* ---------- Boot ---------- */

  setInterval(() => {
    const due = isWorking(currentSession()) ? WORKING_POLL_MS : POLL_MS;
    if (document.visibilityState === 'visible' && Date.now() - state.updatedAt >= due) refresh();
  }, WORKING_POLL_MS);
  setInterval(tick, 15000);
  render();
  loadProjects().then(() => {
    state.updatedAt = Date.now();
    render();
  });
  applyRoute();
</script>
</body>
</html>
